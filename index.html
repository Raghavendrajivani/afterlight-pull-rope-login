<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10131b">
  <meta name="description" content="A cinematic pull-cord login experience illuminated by a hanging lamp.">
  <title>Afterlight — Welcome Back</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="room" data-phase="off">
    <div class="wall-texture" aria-hidden="true"></div>
    <div class="room-furniture" aria-hidden="true">
      <div class="shelf"><i></i><i></i><i></i></div>
      <div class="side-table"><i></i></div>
      <div class="chair"><i></i></div>
    </div>
    <div class="floor" aria-hidden="true"></div>

    <div class="light-system" data-illuminated="false" data-phase="off" aria-hidden="true">
      <div class="lamp-aura"></div>
      <div class="light-cone"></div>
      <div class="floor-light"></div>
      <div class="dust-field"></div>
    </div>

    <div class="lamp-area" data-phase="off">
      <div class="ceiling-cord"></div>
      <div class="lamp-cap"></div>
      <div class="lamp-shade"><div class="shade-rim"></div><div class="bulb"></div></div>
      <div class="rope-zone" data-pulling="false" data-active="true">
        <div class="rope-line"></div>
        <button class="rope-handle" type="button" aria-label="Pull down to turn on the lamp">
          <span class="rope-grip"></span>
        </button>
        <p class="rope-hint">Pull the rope to turn on the light</p>
      </div>
    </div>

    <section class="login-card" data-visible="false" aria-hidden="true">
      <button class="power-control" type="button" aria-label="Turn lamp off and reset">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2v10"></path><path d="M18.4 5.6a9 9 0 1 1-12.8 0"></path></svg>
      </button>
      <div class="card-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6"></path><path d="M10 22h4"></path><path d="M8 14.5a7 7 0 1 1 8 0c-1 .7-1.5 1.5-1.5 2.5h-5c0-1-.5-1.8-1.5-2.5Z"></path><path d="M12 2v2"></path></svg>
      </div>
      <h1>Welcome Back</h1>
      <p class="card-subtitle">Turn on the light and continue.</p>

      <form novalidate>
        <label for="identity">Email or Username</label>
        <div class="field-wrap" data-error="false">
          <input id="identity" name="identity" autocomplete="username" aria-describedby="identity-error">
        </div>
        <p class="field-error" id="identity-error" hidden>Enter your email or username.</p>

        <label for="password">Password</label>
        <div class="field-wrap" data-error="false">
          <input id="password" name="password" type="password" autocomplete="current-password" aria-describedby="password-error">
          <button type="button" class="password-toggle" aria-label="Show password">
            <svg class="eye-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          </button>
        </div>
        <p class="field-error" id="password-error" hidden>Enter your password.</p>

        <div class="form-options">
          <label class="remember"><input type="checkbox" name="remember"><span>Remember me</span></label>
          <a href="#forgot">Forgot password?</a>
        </div>
        <button class="login-button" type="submit">Login
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg>
        </button>
      </form>

      <div class="divider"><span>OR</span></div>
      <div class="social-row">
        <button type="button"><span class="google-mark">G</span><span>Continue with Google</span></button>
        <button type="button"><svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M12 .9a11.1 11.1 0 0 0-3.5 21.63c.55.1.76-.24.76-.53v-2.08c-3.1.68-3.75-1.31-3.75-1.31-.5-1.29-1.24-1.63-1.24-1.63-1.02-.7.08-.69.08-.69 1.13.08 1.73 1.16 1.73 1.16 1 .1.78 2.6 3.48 1.85.1-.73.4-1.23.7-1.52-2.47-.28-5.07-1.24-5.07-5.5 0-1.22.44-2.22 1.16-3-.12-.29-.5-1.43.11-2.97 0 0 .95-.3 3.05 1.15a10.6 10.6 0 0 1 5.55 0c2.1-1.45 3.04-1.15 3.04-1.15.61 1.54.23 2.68.12 2.97.72.78 1.15 1.78 1.15 3.01 0 4.27-2.6 5.21-5.08 5.49.4.35.75 1.02.75 2.06V22c0 .3.2.64.76.53A11.1 11.1 0 0 0 12 .9Z"></path></svg><span>Continue with GitHub</span></button>
      </div>
      <p class="signup-copy">Don't have an account? <a href="#signup">Sign Up</a></p>
    </section>

    <div class="success-toast" data-visible="false" role="status" aria-live="polite">
      <span class="success-mark">✓</span>
      <span><strong>Login successful!</strong><small>Welcome back!</small></span>
    </div>
  </main>
</body>
</html>
